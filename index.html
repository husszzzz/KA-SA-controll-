<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hassany VIP - لوحة تحكم الأكواد</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #121212; color: white; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: auto; }
        .glass-panel { background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(10px); padding: 20px; border-radius: 15px; margin-bottom: 20px; border: 1px solid rgba(255, 255, 255, 0.1); }
        h2 { margin-top: 0; color: #4facfe; }
        input, select { width: 100%; padding: 10px; margin: 10px 0; background: rgba(0,0,0,0.5); border: 1px solid #333; color: white; border-radius: 8px; box-sizing: border-box; }
        button { background: linear-gradient(45deg, #4facfe, #00f2fe); color: black; border: none; padding: 10px 20px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; margin-top: 10px; }
        button:hover { opacity: 0.9; }
        .btn-danger { background: #ff4757; color: white; width: auto; padding: 5px 10px; }
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th, td { padding: 12px; text-align: right; border-bottom: 1px solid #333; }
        th { background: rgba(0,0,0,0.3); }
        .flex-row { display: flex; gap: 10px; align-items: center; }
        .badge { padding: 4px 8px; border-radius: 5px; font-size: 12px; }
        .bg-green { background: #2ed573; color: black; }
        .bg-red { background: #ff4757; color: white; }
    </style>
</head>
<body>

<div class="container">
    <!-- إعدادات الربط -->
    <div class="glass-panel">
        <h2>⚙️ إعدادات GitHub</h2>
        <input type="password" id="ghToken" placeholder="أدخل توكن GitHub (يبدأ بـ ghp_)">
        <input type="text" id="repoName" placeholder="اسم الحساب/المستودع (مثال: husszzzz/KA-SA)" value="husszzzz/KA-SA">
        <button onclick="loadCodes()">💾 حفظ الإعدادات وجلب الأكواد</button>
        <p id="statusMsg" style="text-align: center; font-size: 14px; color: #2ed573;"></p>
    </div>

    <!-- إضافة كود جديد -->
    <div class="glass-panel">
        <h2>➕ إضافة كود جديد</h2>
        <div class="flex-row">
            <input type="text" id="newCode" placeholder="اكتب الكود هنا أو اضغط توليد">
            <button onclick="generateCode()" style="width: 150px;">توليد عشوائي</button>
        </div>
        <select id="codeDuration">
            <option value="0">بدون مدة (دائمي / مدى الحياة)</option>
            <option value="1">يوم واحد</option>
            <option value="2">يومان</option>
            <option value="3">3 أيام</option>
            <option value="7">أسبوع</option>
            <option value="30">شهر</option>
        </select>
        <button onclick="addCode()">إضافة الكود للقاعدة</button>
    </div>

    <!-- جدول الأكواد -->
    <div class="glass-panel">
        <h2>📋 قائمة الأكواد</h2>
        <table>
            <thead>
                <tr>
                    <th>الكود</th>
                    <th>المدة</th>
                    <th>الحالة</th>
                    <th>تاريخ الانتهاء</th>
                    <th>إجراء</th>
                </tr>
            </thead>
            <tbody id="codesTable">
                <!-- سيتم حقن الأكواد هنا -->
            </tbody>
        </table>
    </div>
</div>

<script>
    const FILE_PATH = "codes.json";
    let fileSha = "";
    let codesDb = {};

    // تحميل البيانات المحفوظة محلياً عند فتح الصفحة
    window.onload = () => {
        if(localStorage.getItem("ghToken")) {
            document.getElementById("ghToken").value = localStorage.getItem("ghToken");
            document.getElementById("repoName").value = localStorage.getItem("repoName") || "husszzzz/KA-SA";
            loadCodes();
        }
    };

    function showStatus(msg, isError = false) {
        const el = document.getElementById("statusMsg");
        el.style.color = isError ? "#ff4757" : "#2ed573";
        el.innerText = msg;
    }

    function generateCode() {
        const randomPart = Math.random().toString(36).substr(2, 6).toUpperCase();
        document.getElementById("newCode").value = "VIP-" + randomPart;
    }

    async function loadCodes() {
        const token = document.getElementById("ghToken").value;
        const repo = document.getElementById("repoName").value;
        if(!token) return alert("يرجى إدخال التوكن!");
        
        localStorage.setItem("ghToken", token);
        localStorage.setItem("repoName", repo);
        showStatus("جاري جلب الأكواد...");

        try {
            const res = await fetch(`https://api.github.com/repos/${repo}/contents/${FILE_PATH}`, {
                headers: { "Authorization": `token ${token}` }
            });
            if(!res.ok) throw new Error("تأكد من التوكن واسم المستودع!");
            
            const data = await res.json();
            fileSha = data.sha;
            
            // فك تشفير الملف
            const decodedContent = decodeURIComponent(escape(window.atob(data.content)));
            codesDb = JSON.parse(decodedContent);
            
            renderTable();
            showStatus("✅ تم جلب الأكواد بنجاح!");
        } catch (e) {
            showStatus("❌ خطأ: " + e.message, true);
        }
    }

    function renderTable() {
        const tbody = document.getElementById("codesTable");
        tbody.innerHTML = "";
        
        for (const [code, info] of Object.entries(codesDb)) {
            // دعم التوافق مع الأكواد القديمة (True/False)
            const isUsed = (typeof info === 'boolean') ? info : info.is_used;
            const duration = (typeof info === 'boolean') ? "غير محدد" : (info.duration === 0 ? "دائمي" : info.duration + " أيام");
            const expiry = info.expires_at ? info.expires_at : "غير مفعل بعد";
            
            const statusBadge = isUsed 
                ? `<span class="badge bg-red">مستخدم</span>` 
                : `<span class="badge bg-green">جديد</span>`;

            tbody.innerHTML += `
                <tr>
                    <td style="font-family: monospace;">${code}</td>
                    <td>${duration}</td>
                    <td>${statusBadge}</td>
                    <td dir="ltr" style="text-align: right;">${expiry}</td>
                    <td><button class="btn-danger" onclick="deleteCode('${code}')">حذف</button></td>
                </tr>
            `;
        }
    }

    async function addCode() {
        const code = document.getElementById("newCode").value.trim();
        const duration = parseInt(document.getElementById("codeDuration").value);
        if(!code) return alert("اكتب الكود أولاً!");
        if(codesDb[code]) return alert("هذا الكود موجود مسبقاً!");

        // الهيكلية الجديدة للكود
        codesDb[code] = {
            is_used: false,
            duration: duration,
            expires_at: null
        };
        
        await saveToGithub("إضافة كود جديد: " + code);
        document.getElementById("newCode").value = "";
    }

    async function deleteCode(code) {
        if(!confirm(`هل أنت متأكد من حذف الكود ${code}؟`)) return;
        delete codesDb[code];
        await saveToGithub("حذف كود: " + code);
    }

    async function saveToGithub(commitMsg) {
        showStatus("⏳ جاري الحفظ في القاعدة...");
        const token = localStorage.getItem("ghToken");
        const repo = localStorage.getItem("repoName");
        
        const jsonStr = JSON.stringify(codesDb, null, 2);
        const encodedContent = window.btoa(unescape(encodeURIComponent(jsonStr)));

        const body = {
            message: commitMsg,
            content: encodedContent,
            sha: fileSha
        };

        try {
            const res = await fetch(`https://api.github.com/repos/${repo}/contents/${FILE_PATH}`, {
                method: "PUT",
                headers: {
                    "Authorization": `token ${token}`,
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(body)
            });
            
            if(!res.ok) throw new Error("فشل الحفظ!");
            const data = await res.json();
            fileSha = data.content.sha; // تحديث SHA للمرات القادمة
            
            renderTable();
            showStatus("✅ تم الحفظ بنجاح!");
        } catch (e) {
            showStatus("❌ خطأ أثناء الحفظ", true);
        }
    }
</script>

</body>
</html>
